source: >-
  components.schemas.CallbackDelivery in openapi/pictomancer-ai-openapi.yml (verbatim field descriptions)
  and changelog v0.6.1 "Callback delivery — POST results to your endpoint" at https://pictomancer.ai/changelog.
  Pictomancer publishes no AsyncAPI document and no event catalog; this is the one outbound HTTP surface it
