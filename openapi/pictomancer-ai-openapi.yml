    ResizeRequest:
      properties:
        delivery:
          oneOf:
          - $ref: '#/components/schemas/InlineDelivery'
          - $ref: '#/components/schemas/PutUrlDelivery'
          - $ref: '#/components/schemas/CallbackDelivery'
          title: Delivery
          discriminator:
            propertyName: mode
            mapping:
              callback_url: '#/components/schemas/CallbackDelivery'
              inline: '#/components/schemas/InlineDelivery'
              put_url: '#/components/schemas/PutUrlDelivery'
        source:
          type: string
          title: Source
          description: 'Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like
            data:image/png;base64,...).'
        scale_x:
          anyOf:
          - type: number
          - type: 'null'
          title: Scale X
          description: Horizontal scale factor (e.g. 0.5 = half width). If only scale_x is given, scale_y defaults to the
            same value.
        scale_y:
          anyOf:
          - type: number
          - type: 'null'
          title: Scale Y
          description: Vertical scale factor (e.g. 0.75 = 75% height). Optional; defaults to scale_x if omitted.
        scale:
          anyOf:
          - type: number
          - type: 'null'
          title: Scale
          description: Uniform scale factor applied to both axes (e.g. 0.5 = half size). Use this for simple scaling; use
            scale_x/scale_y for independent axes.
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
          description: 'Output format: jpeg, png, webp, tiff, gif, or avif. If omitted, the original format is preserved.'
        width:
          anyOf:
          - type: integer
          - type: 'null'
          title: Width
          description: 'Target width in pixels for fill mode: resize and smart-crop to these exact dimensions in one call.
            Requires height. Mutually exclusive with scale/scale_x/scale_y. Upscaling is allowed.'
        height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
          description: Target height in pixels for fill mode. Requires width.
        gravity:
          anyOf:
          - type: string
          - type: 'null'
          title: Gravity
          description: 'Fill-mode smart-crop strategy: one of (''attention'', ''entropy'', ''centre''). Only valid together
            with width and height; defaults to attention.'
        autorot:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Autorot
          description: Apply EXIF orientation before resizing. Opt-in; default false, which preserves current byte-for-byte
            behavior.
        denoise:
          anyOf:
          - type: integer
          - type: 'null'
          title: Denoise
          description: 'Median denoise before resizing: radius 1-3 (window 3x3 to 7x7). Opt-in; no surcharge.'
        equalize:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Equalize
          description: Auto-contrast (histogram equalisation of the value channel; hue and saturation preserved) before resizing.
            Opt-in.
        sharpen:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sharpen
          description: Unsharp-mask sharpen after resizing (libvips defaults). Opt-in.
