openapi: 3.1.0
info:
  title: Pictomancer.ai Gateway
  version: 0.1.0
paths:
  /v1/info:
    get:
      summary: Get supported formats and options
      description: Returns supported output formats and their configurable options.
      operationId: get_format_info
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/estimate:
    post:
      summary: Estimate the price of an operation
      description: 'Returns the exact USD price this API would charge for an operation on an input of the given size, without
        fetching or processing anything. Free. Use it before paying: send X-Max-Cost-USD on the real request to have the API
        refuse (412) instead of charging more than you allowed. The list price is returned even when the request could end
        up free (free tier, or a compress that does not shrink the file).'
      operationId: estimate_cost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/analyze:
    post:
      summary: Analyze an image
      description: 'Fetch an image from a URL or base64 and return its metadata: size in bytes, pixel dimensions, source format,
        and what it costs every supported vision model in tokens. Always free. Dimensions are omitted if the image header
        cannot be read. Also reports whether the input carries a C2PA (Content Credentials) manifest and in which container;
        the manifest is not validated.'
      operationId: analyze_image
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageSource'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/resize:
    post:
      summary: Resize an image
      description: 'Scale an image by a factor, or fill an exact box. Use ''scale'' for uniform scaling, or ''scale_x''/''scale_y''
        for independent axes (float factors, e.g. 0.5 = half size). Alternatively set ''width''+''height'' for fill mode:
        resize and smart-crop to those exact dimensions in one call (optional ''gravity'', default attention). The two modes
        are mutually exclusive. Optional enhancement modifiers: denoise (1-3), equalize, sharpen (applied denoise -> equalize
        -> op -> sharpen).'
      operationId: resize_image
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeRequest'
        required: true
      responses:
        '200':
          description: Processed image binary
          content:
            application/json:
              schema: {}
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/compress:
    post:
      summary: Compress an image
      description: 'Re-encode an image with quality/format options to reduce file size. Supports jpeg, png, webp, tiff, gif.
        Instead of a q number you can set quality_target (0-1]: the smallest file with SSIM at or above the target, searched
        on the worker (jpeg, webp, avif; flat surcharge; outcome reported in X-Pictomancer-Quality-* headers). If the output
        is not smaller than the input, the request is free (X-Pig-Billed: 0) and does not consume free-tier quota. Optional
        enhancement modifiers: denoise (1-3), equalize, sharpen (applied denoise -> equalize -> op -> sharpen).'
      operationId: compress_image
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressRequest'
        required: true
      responses:
        '200':
          description: Processed image binary
          content:
            application/json:
              schema: {}
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/convert:
    post:
      summary: Convert image format
      description: 'Convert an image to a different format (jpeg, png, webp, tiff, gif, avif). Optionally set quality, strip
        metadata, enable lossless mode (webp, avif), or tune encoder effort (avif). Instead of a q number you can set quality_target
        (0-1]: the smallest file with SSIM at or above the target, searched on the worker (jpeg, webp, avif; flat surcharge;
        outcome reported in X-Pictomancer-Quality-* headers). Optional enhancement modifiers: denoise (1-3), equalize, sharpen
        (applied denoise -> equalize -> op -> sharpen).'
      operationId: convert_image
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequest'
        required: true
      responses:
        '200':
          description: Processed image binary
          content:
            application/json:
              schema: {}
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/crop:
    post:
      summary: Crop an image
      description: 'Extract a rectangular region from an image, in one of three mutually exclusive modes. Manual: give the
        top-left corner (x, y) and dimensions (width, height) in pixels. Smart crop: give ''gravity'' (attention, entropy,
        centre) plus width and height; the window is picked automatically, clamped to the source if the target is larger.
        Trim: set ''trim: true'' (optional ''threshold'') to remove a uniform background border via content detection; the
        applied rect is reported in X-Pictomancer-Trim-* headers. Optional enhancement modifiers: denoise (1-3), equalize,
        sharpen (applied denoise -> equalize -> op -> sharpen).'
      operationId: crop_image
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropRequest'
        required: true
      responses:
        '200':
          description: Processed image binary
          content:
            application/json:
              schema: {}
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/optimize_for_vision:
    post:
      summary: Resize an image for a vision model
      description: 'Resize an image to the largest size a given vision model still benefits from, and report what it costs
        that model in tokens before and after. Every provider downscales oversized input before counting tokens, so this alone
        saves bytes and upload latency rather than tokens. Pass max_tokens to trade resolution for tokens: that lever is continuous
        on Claude, unavailable on OpenAI (cost follows the aspect ratio alone), and on Gemini reaches only a flat 258. An
        image already within budget is returned untouched and free (X-Pig-Billed: 0).'
      operationId: optimize_for_vision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeForVisionRequest'
        required: true
      responses:
        '200':
          description: Processed image binary
          content:
            application/json:
              schema: {}
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/optimize_generated:
    post:
      summary: Optimize an AI-generated image for the web
      description: 'The step after image generation. gpt-image, DALL-E, Flux, Midjourney and Stable Diffusion hand back 2-8
        MB PNGs; this returns the same picture as a web-ready webp (default), avif, jpeg or png, metadata stripped, transparency
        kept on webp/avif/png. Optional max_dimension caps the longest side (never upscales); optional q or quality_target
        (smallest file with SSIM >= target, flat surcharge) control quality. Same price as convert. If the result is not smaller
        than the input it is still returned but free (X-Pig-Billed: 0). X-Pictomancer-Bytes-Before/-After/-Saved-Percent report
        the saving. The input''s C2PA manifest, if any, is reported in X-Pictomancer-C2PA-Input but is not carried over: re-encoding
        invalidates it.'
      operationId: optimize_generated_image
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeGeneratedRequest'
        required: true
      responses:
        '200':
          description: Processed image binary
          content:
            application/json:
              schema: {}
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pipeline:
    post:
      summary: Run a multi-step image pipeline
      description: Chain multiple operations (resize, compress, convert, crop) in sequence. The image is fetched once, then
        each operation is applied to the output of the previous one. Max 10 operations per pipeline.
      operationId: image_pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRequest'
        required: true
      responses:
        '200':
          description: Processed image binary
          content:
            application/json:
              schema: {}
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnalyzeResponse:
      properties:
        size_bytes:
          type: integer
          title: Size Bytes
          description: File size of the fetched image in bytes.
        width:
          anyOf:
          - type: integer
          - type: 'null'
          title: Width
          description: Image width in pixels, if it could be read.
        height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
          description: Image height in pixels, if it could be read.
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
          description: Detected source format, e.g. jpeg, png, webp, avif.
        vision_tokens:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Vision Tokens
          description: What this image costs each supported vision model, in tokens. Providers downscale oversized input before
            counting, so these are the prices actually charged, not a naive pixel estimate.
        c2pa_manifest:
          type: boolean
          title: C2Pa Manifest
          description: True when the input embeds a C2PA (Content Credentials) manifest. Presence only; the signature is not
            validated.
          default: false
        provenance:
          anyOf:
          - $ref: '#/components/schemas/ProvenanceInfo'
          - type: 'null'
          description: 'C2PA detection detail: {c2pa: bool, container: ''jpeg-app11'' | ''png-caBX'' | ''webp-C2PA'' | ''isobmff-uuid''
            | null}.'
      type: object
      required:
      - size_bytes
      title: AnalyzeResponse
    CallbackDelivery:
      properties:
        mode:
          type: string
          const: callback_url
          title: Mode
        callback_url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Callback Url
          description: Customer endpoint where the optimized bytes will be POSTed. Must be https://. For async/large jobs.
            We send an X-Pig-Sha256 header of the body so the receiver can verify integrity. No credentials are stored on
            our side; secure the endpoint with a token in the URL itself.
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Headers
          description: Optional headers to include on the POST call (Content-Type, Cache-Control, x-amz-*, etc.). Whitelisted
            at SSRF layer.
        secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret
          description: 'Optional HMAC secret. When set, we sign the POST body with HMAC-SHA256 and send ''X-Pig-Signature:
            sha256=<hex>''. Used per request and never stored. Recompute the HMAC on your endpoint to authenticate the callback
            (constant-time compare).'
      additionalProperties: false
      type: object
      required:
      - mode
      - callback_url
      title: CallbackDelivery
    CompressRequest:
      properties:
        delivery:
          oneOf:
          - $ref: '#/components/schemas/InlineDelivery'
          - $ref: '#/components/schemas/PutUrlDelivery'
          - $ref: '#/components/schemas/CallbackDelivery'
          title: Delivery
          discriminator:
            propertyName: mode
            mapping:
              callback_url: '#/components/schemas/CallbackDelivery'
              inline: '#/components/schemas/InlineDelivery'
              put_url: '#/components/schemas/PutUrlDelivery'
        source:
          type: string
          title: Source
          description: 'Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like
            data:image/png;base64,...).'
        q:
          anyOf:
          - type: integer
          - type: 'null'
          title: Q
          description: 'Quality (1-100). Lower = smaller file. Typical values: 60-80 for web, 85-95 for print. Maps to libvips
            Q parameter.'
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
          description: 'Output format: jpeg, png, webp, tiff, gif, or avif. If omitted, the original format is preserved.'
        strip:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Strip
          description: Strip metadata (EXIF, ICC profile, etc.) from the output. Reduces file size slightly.
        quality_target:
          anyOf:
          - type: number
          - type: 'null'
          title: Quality Target
          description: 'Target SSIM (0-1]: the worker searches for the smallest file that still scores at least this. Alternative
            to q; mutually exclusive with it. Requires an explicit format among jpeg, webp, avif. Carries a flat surcharge
            for the extra encodes.'
        autorot:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Autorot
          description: Apply EXIF orientation before compressing. Opt-in; default false, which preserves current byte-for-byte
            behavior.
        denoise:
          anyOf:
          - type: integer
          - type: 'null'
          title: Denoise
          description: 'Median denoise before compressing: radius 1-3 (window 3x3 to 7x7). Opt-in; no surcharge.'
        equalize:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Equalize
          description: Auto-contrast (histogram equalisation of the value channel; hue and saturation preserved) before compressing.
            Opt-in.
        sharpen:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sharpen
          description: Unsharp-mask sharpen after compressing (libvips defaults). Opt-in.
      additionalProperties: true
      type: object
      required:
      - source
      title: CompressRequest
    ConvertRequest:
      properties:
        delivery:
          oneOf:
          - $ref: '#/components/schemas/InlineDelivery'
          - $ref: '#/components/schemas/PutUrlDelivery'
          - $ref: '#/components/schemas/CallbackDelivery'
          title: Delivery
          discriminator:
            propertyName: mode
            mapping:
              callback_url: '#/components/schemas/CallbackDelivery'
              inline: '#/components/schemas/InlineDelivery'
              put_url: '#/components/schemas/PutUrlDelivery'
        source:
          type: string
          title: Source
          description: 'Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like
            data:image/png;base64,...).'
        format:
          type: string
          title: Format
          description: 'Target format: jpeg, png, webp, tiff, gif, or avif.'
        q:
          anyOf:
          - type: integer
          - type: 'null'
          title: Q
          description: Quality (1-100). Maps to libvips Q parameter.
        strip:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Strip
          description: Strip metadata (EXIF, ICC profile, etc.) from the output.
        lossless:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Lossless
          description: Enable lossless encoding. Only applies to webp and avif.
        effort:
          anyOf:
          - type: integer
          - type: 'null'
          title: Effort
          description: AV1 encoder CPU effort (0-9). Higher = smaller file, slower. Only applies to avif.
        quality_target:
          anyOf:
          - type: number
          - type: 'null'
          title: Quality Target
          description: 'Target SSIM (0-1]: the worker searches for the smallest file that still scores at least this. Alternative
            to q; mutually exclusive with it and with lossless. Only for jpeg, webp, avif. Carries a flat surcharge for the
            extra encodes.'
        autorot:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Autorot
          description: Apply EXIF orientation before converting. Opt-in; default false, which preserves current byte-for-byte
            behavior.
        denoise:
          anyOf:
          - type: integer
          - type: 'null'
          title: Denoise
          description: 'Median denoise before converting: radius 1-3 (window 3x3 to 7x7). Opt-in; no surcharge.'
        equalize:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Equalize
          description: Auto-contrast (histogram equalisation of the value channel; hue and saturation preserved) before converting.
            Opt-in.
        sharpen:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sharpen
          description: Unsharp-mask sharpen after converting (libvips defaults). Opt-in.
      additionalProperties: true
      type: object
      required:
      - source
      - format
      title: ConvertRequest
    CropRequest:
      properties:
        delivery:
          oneOf:
          - $ref: '#/components/schemas/InlineDelivery'
          - $ref: '#/components/schemas/PutUrlDelivery'
          - $ref: '#/components/schemas/CallbackDelivery'
          title: Delivery
          discriminator:
            propertyName: mode
            mapping:
              callback_url: '#/components/schemas/CallbackDelivery'
              inline: '#/components/schemas/InlineDelivery'
              put_url: '#/components/schemas/PutUrlDelivery'
        source:
          type: string
          title: Source
          description: 'Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like
            data:image/png;base64,...).'
        x:
          anyOf:
          - type: integer
          - type: 'null'
          title: X
          description: Left edge of the crop rectangle in pixels. Manual mode only.
        y:
          anyOf:
          - type: integer
          - type: 'null'
          title: Y
          description: Top edge of the crop rectangle in pixels. Manual mode only.
        width:
          anyOf:
          - type: integer
          - type: 'null'
          title: Width
          description: Width of the crop rectangle in pixels. Required in manual and gravity modes.
        height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
          description: Height of the crop rectangle in pixels. Required in manual and gravity modes.
        gravity:
          anyOf:
          - type: string
          - type: 'null'
          title: Gravity
          description: 'Smart-crop mode: picks the window automatically. One of (''attention'', ''entropy'', ''centre'').
            Requires width and height; mutually exclusive with x/y and trim. A target larger than the source clamps to the
            source size.'
        trim:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Trim
          description: 'Trim mode: removes a uniform background border via content detection. Mutually exclusive with x/y/width/height/gravity.'
        threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Threshold
          description: 'Trim sensitivity (must be positive; default 10.0). Only valid together with trim: true.'
        autorot:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Autorot
          description: Apply EXIF orientation before cropping. Opt-in; default false, which preserves current byte-for-byte
            behavior.
        denoise:
          anyOf:
          - type: integer
          - type: 'null'
          title: Denoise
          description: 'Median denoise before cropping: radius 1-3 (window 3x3 to 7x7). Opt-in; no surcharge.'
        equalize:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Equalize
          description: Auto-contrast (histogram equalisation of the value channel; hue and saturation preserved) before cropping.
            Opt-in.
        sharpen:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sharpen
          description: Unsharp-mask sharpen after cropping (libvips defaults). Opt-in.
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
          description: 'Output format: jpeg, png, webp, tiff, gif, or avif. If omitted, the original format is preserved.'
      additionalProperties: true
      type: object
      required:
      - source
      title: CropRequest
    EstimateOperation:
      properties:
        type:
          type: string
          title: Type
          description: 'Operation type: resize, compress, convert, or crop.'
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
          description: Requested output format for this operation; only avif changes the price.
      type: object
      required:
      - type
      title: EstimateOperation
    EstimateRequest:
      properties:
        operation:
          type: string
          title: Operation
          description: Operation to price. One of resize, compress, convert, crop, optimize_for_vision, optimize_generated,
            pipeline. analyze is always free.
        input_bytes:
          type: integer
          minimum: 1.0
          title: Input Bytes
          description: Size of the input image in bytes. Get it from analyze_image (free) if you do not know it.
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
          description: Requested output format; only avif changes the price.
        quality_target:
          type: boolean
          title: Quality Target
          description: Whether the request will use quality_target (SSIM search surcharge).
          default: false
        operations:
          anyOf:
          - items:
              $ref: '#/components/schemas/EstimateOperation'
            type: array
          - type: 'null'
          title: Operations
          description: 'For pipeline only: the ordered operations, each {type, format?}. Volume discount applies at 3+ operations.'
      type: object
      required:
      - operation
      - input_bytes
      title: EstimateRequest
    EstimateResponse:
      properties:
        operation:
          type: string
          title: Operation
          description: Operation that was priced.
        price_usd:
          type: number
          title: Price Usd
          description: Exact list price in USD the API would charge.
        base_usd:
          type: number
          title: Base Usd
          description: Base price of the operation(s) before multipliers and surcharges.
        surcharges_usd:
          additionalProperties:
            type: number
          type: object
          title: Surcharges Usd
          description: Surcharges applied, keyed by name (avif, quality_target); empty when none.
        size_multiplier:
          type: number
          title: Size Multiplier
          description: Multiplier applied for the input size tier.
        pipeline_discount:
          anyOf:
          - type: number
          - type: 'null'
          title: Pipeline Discount
          description: Volume discount factor for pipelines of 3+ operations; null otherwise.
        within_free_tier:
          type: boolean
          title: Within Free Tier
          description: Whether the caller is still within the free tier.
        free_tier_remaining:
          type: integer
          title: Free Tier Remaining
          description: Free-tier requests left for the caller.
        currency:
          type: string
          title: Currency
          description: Settlement currency.
        network:
          type: string
          title: Network
          description: Settlement network.
      type: object
      required:
      - operation
      - price_usd
      - base_usd
      - surcharges_usd
      - size_multiplier
      - pipeline_discount
      - within_free_tier
      - free_tier_remaining
      - currency
      - network
      title: EstimateResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImageSource:
      properties:
        source:
          type: string
          title: Source
          description: 'Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like
            data:image/png;base64,...).'
      type: object
      required:
      - source
      title: ImageSource
    InlineDelivery:
      properties:
        mode:
          type: string
          const: inline
          title: Mode
          default: inline
      additionalProperties: false
      type: object
      title: InlineDelivery
    OptimizeForVisionRequest:
      properties:
        delivery:
          oneOf:
          - $ref: '#/components/schemas/InlineDelivery'
          - $ref: '#/components/schemas/PutUrlDelivery'
          - $ref: '#/components/schemas/CallbackDelivery'
          title: Delivery
          discriminator:
            propertyName: mode
            mapping:
              callback_url: '#/components/schemas/CallbackDelivery'
              inline: '#/components/schemas/InlineDelivery'
              put_url: '#/components/schemas/PutUrlDelivery'
        source:
          type: string
          title: Source
          description: 'Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like
            data:image/png;base64,...).'
        target_model:
          type: string
          title: Target Model
          description: 'Vision model the image is being prepared for, e.g. claude-opus-5, gpt-4o, gemini-2.5-pro. Unknown
            ids are rejected rather than guessed: the wrong limits would silently resize to the wrong size.'
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
          description: 'Optional cap on what the image may cost the target model. Without it the image is resized to the model''s
            own ceiling, which saves bytes and upload latency but no tokens, because every provider already downscales oversized
            input before counting. Set a budget to trade resolution for tokens. The response reports the cost actually achieved:
            on OpenAI it cannot be lowered by resizing at all, and on Gemini only down to a flat 258.'
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
          description: 'Output format: jpeg, png, webp, tiff, gif, or avif. If omitted, the original format is preserved.'
        q:
          anyOf:
          - type: integer
          - type: 'null'
          title: Q
          description: Quality (1-100). Maps to libvips Q parameter.
      additionalProperties: true
      type: object
      required:
      - source
      - target_model
      title: OptimizeForVisionRequest
    OptimizeGeneratedRequest:
      properties:
        delivery:
          oneOf:
          - $ref: '#/components/schemas/InlineDelivery'
          - $ref: '#/components/schemas/PutUrlDelivery'
          - $ref: '#/components/schemas/CallbackDelivery'
          title: Delivery
          discriminator:
            propertyName: mode
            mapping:
              callback_url: '#/components/schemas/CallbackDelivery'
