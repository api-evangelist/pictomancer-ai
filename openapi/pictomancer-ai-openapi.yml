              put_url: '#/components/schemas/PutUrlDelivery'
        source:
          type: string
          title: Source
          description: 'Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like
            data:image/png;base64,...).'
        format:
          type: string
          title: Format
          description: 'Output format: webp (default), avif, jpeg or png. webp, avif and png keep transparency; jpeg flattens
            it.'
          default: webp
        q:
          anyOf:
          - type: integer
          - type: 'null'
          title: Q
          description: Quality (1-100). Maps to libvips Q parameter. Omit to use the encoder default; or set quality_target
            instead.
        quality_target:
          anyOf:
          - type: number
          - type: 'null'
          title: Quality Target
          description: 'Target SSIM (0-1]: the worker searches for the smallest file that still scores at least this. Alternative
            to q; mutually exclusive with it. Carries a flat surcharge for the extra encodes.'
        max_dimension:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Dimension
          description: Cap on the longest side in pixels. Larger images are scaled down to fit, aspect ratio preserved; smaller
            images are never upscaled.
        strip:
          type: boolean
          title: Strip
          description: 'Strip metadata. Defaults to true: generated images carry no EXIF worth keeping. Metadata includes
            any C2PA manifest, which would be invalid after re-encoding anyway.'
          default: true
      additionalProperties: true
      type: object
      required:
      - source
      title: OptimizeGeneratedRequest
