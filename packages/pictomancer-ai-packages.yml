description: >-
  First-party client libraries for the Pictomancer.ai REST API, all published under the
  github.com/pictomancer organization and listed on the company homepage. Every registry release
  is dated 2026-08-17, the day of the v0.10.0 changelog entry, and the changelog names the SDK
  versions that carry each feature (v0.11.0: Python 0.7.0, Node 0.5.0, PHP 0.6.0, Go 0.6.0, n8n
  0.6.0). GitHub "latest release" tags lag the registries (the org cuts registry releases without
  GitHub releases after July). The WordPress plugin is distributed from GitHub releases only — the
  wordpress.org directory returns "Plugin not found". No SDK is an MCP server; the MCP surface is
  the hosted endpoint in mcp/pictomancer-ai-mcp.yml.
