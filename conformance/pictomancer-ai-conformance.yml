standards:
- id: mcp
  conforms: true
  version: '2025-06-18'
  evidence: >-
    POST https://api.pictomancer.ai/mcp initialize returned protocolVersion 2025-06-18 with a tools capability; tools/list returned 10 tools with JSON Schema inputSchema (mcp/pictomancer-ai-mcp-tools.json). Streamable HTTP with mcp-session-id. Listed in registry.modelcontextprotocol.io as ai.pictomancer/image-processing.
- id: a2a
  conforms: true
  version: '0.3 (canonical card) / 1.0 (apex card)'
  evidence: >-
    https://api.pictomancer.ai/.well-known/agent-card.json parses as an AgentCard with capabilities object, protocolVersion and 8 skills (graded conformant in a2a/pictomancer-ai-a2a.yml); POST https://api.pictomancer.ai/a2a answers JSON-RPC.
- id: x402
  conforms: true
  evidence: >-
    Agent card capabilities.extensions[0].uri https://x402.org (chain base, token USDC, freeTier 50); POST /v1/estimate returned {"currency":"USDC","network":"base","within_free_tier":true}; homepage documents 402 -> pay -> 200 and llms.txt names "USDC on Base network via x402 protocol". The 402 challenge itself was not triggered (doing so would spend the provider's compute).
- id: c2pa
  conforms: true
  scope: detection-only
  evidence: >-
    The contract declares Content Credentials vocabulary — components.schemas.ProvenanceInfo {c2pa: boolean, container: jpeg-app11 | png-caBX | webp-C2PA | isobmff-uuid} on AnalyzeResponse, and the X-Pictomancer-C2PA-Input response header (changelog v0.12.0). The provider states manifests are detected but NOT validated and never carried over to outputs; this is not a C2PA signing implementation.
- id: openapi
  conforms: true
  version: 3.1.0
  evidence: >-
    https://api.pictomancer.ai/openapi.json is OpenAPI 3.1.0 with 10 paths and 19 schemas; Swagger UI at /docs.
- id: rfc8615-well-known
  conforms: true
  evidence: >-
    /.well-known/agent-card.json, /.well-known/agent.json and /.well-known/mcp.json are served as application/json on api.pictomancer.ai; no security.txt, openid-configuration or oauth metadata (well-known/pictomancer-ai-well-known.yml).
- id: prometheus-exposition
  conforms: true
  evidence: >-
    GET https://api.pictomancer.ai/metrics returned 200, 77 KB, Content-Type "text/plain; version=1.0.0; charset=utf-8" (pig_delivery_* counters named in changelog v0.6.0). Public, unauthenticated.
