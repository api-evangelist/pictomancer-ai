- aid: pictomancer-ai:pictomancer-ai-image-api
  name: Pictomancer.ai Image API
  description: 'REST API for image transformation: get_format_info, estimate_cost, analyze_image, resize_image,
    compress_image, convert_image, crop_image, optimize_for_vision, optimize_generated_image and image_pipeline
    (chain up to 10 steps, billed as one). JSON in, image bytes out (or JSON for analyze/estimate/info, or a delivery
    receipt when writing to your bucket). OpenAPI 3.1.0 served at https://api.pictomancer.ai/openapi.json with Swagger
    UI at /docs. Free tier of 50 requests per identity, then x402 USDC micropayments or an API key.'
