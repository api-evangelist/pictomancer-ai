aid: pictomancer-ai
name: Pictomancer.ai
description: 'Pictomancer.ai is a Spain-registered image-optimization API built for agents: resize, compress, convert,
  crop, optimize-for-vision and one-call optimization of AI-generated images, processed in under 50 ms and priced
  per request ($0.001-$0.03, analyze free). The same ten operations are published three ways — an OpenAPI 3.1 REST
  API, a hosted MCP server (Streamable HTTP, listed in the official MCP Registry) and an A2A agent card — and are
  paid for anonymously with USDC on Base via x402 (HTTP 402 -> pay -> retry), with an API key, or free for the first
  50 requests per identity. Results return inline, PUT to the caller''s own bucket, or POST to a callback endpoint.
  First-party SDKs ship for Python, Node, PHP and Go plus an n8n node and a WordPress plugin.'
url: https://raw.githubusercontent.com/api-evangelist/pictomancer-ai/refs/heads/main/apis.yml
image: https://pictomancer.ai/apple-icon.png
