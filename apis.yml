- aid: pictomancer-ai:pictomancer-ai-a2a-agent
  name: Pictomancer.ai A2A Agent
  description: >-
    Agent-to-Agent endpoint at https://api.pictomancer.ai/a2a (JSON-RPC) described by a published agent
    card — canonical /.well-known/agent-card.json on api.pictomancer.ai (protocolVersion 0.3, graded conformant)
    and a legacy /.well-known/agent.json on the apex (protocolVersion 1.0, with an x402 pricing extension).
    Eight skills mirror the REST operations: analyze, resize, compress, convert, crop, optimize_for_vision,
    optimize_generated_image and image_pipeline.
  humanURL: https://api.pictomancer.ai/.well-known/agent-card.json
  baseURL: https://api.pictomancer.ai/a2a
