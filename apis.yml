- aid: pictomancer-ai:pictomancer-ai-mcp-server
  name: Pictomancer.ai MCP Server
  description: >-
    Official hosted Model Context Protocol server at https://api.pictomancer.ai/mcp (Streamable HTTP,
    protocol revision 2025-06-18, no authentication required, 120 requests/minute). Anonymous tools/list
    returns ten tools with full JSON Schema inputSchema, one per REST operation. Discoverable via /.well-known/mcp.json
    on pictomancer.ai and api.pictomancer.ai and listed in the official MCP Registry as ai.pictomancer/image-processing;
    mcp.pictomancer.ai is a 308 alias.
  humanURL: https://pictomancer.ai/llms.txt
  baseURL: https://api.pictomancer.ai/mcp
