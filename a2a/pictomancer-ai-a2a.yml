    /.well-known/agent-card.json on api.pictomancer.ai (protocolVersion 0.3, additionalInterfaces —
    saved as the primary card), the legacy /.well-known/agent.json on api.pictomancer.ai, and the
    legacy /.well-known/agent.json on the apex pictomancer.ai (protocolVersion 1.0, interfaces[] +
    supportedInterfaces[], a pricing block and an x402 extension — saved as
