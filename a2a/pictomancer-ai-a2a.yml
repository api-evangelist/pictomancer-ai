    name https://pictomancer.ai/.well-known/agent.json as the A2A agent card. Ownership is not in
    question — the card's url is https://api.pictomancer.ai/a2a, the same host that serves the
    OpenAPI and MCP endpoint, and the apex card's provider.organization is "Pictomancer.ai".
