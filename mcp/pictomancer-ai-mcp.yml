    ```

    Content-Type: image/png


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/webp


    **Example Response:**

    ```json

    "string"

    ```'
  input_schema:
    required:
    - source
    - format
    properties:
      delivery: string
      source: string
      format: string
      q: integer
      strip: boolean
      lossless: boolean
      effort: integer
      quality_target: number
      autorot: boolean
      denoise: integer
      equalize: boolean
      sharpen: boolean
  source_operation: openapi/pictomancer-ai-openapi.yml#convert_image
- name: crop_image
  description: 'Crop an image


    Extract a rectangular region from an image, in one of three mutually exclusive modes. Manual: give
    the top-left corner (x, y) and dimensions (width, height) in pixels. Smart crop: give ''gravity''
    (attention, entropy, centre) plus width and height; the window is picked automatically, clamped to
    the source if the target is larger. Trim: set ''trim: true'' (optional ''threshold'') to remove a
    uniform background border via content detection; the applied rect is reported in X-Pictomancer-Trim-*
    headers. Optional enhancement modifiers: denoise (1-3), equalize, sharpen (applied denoise -> equalize
    -> op -> sharpen).


    ### Responses:


    **200**: Processed image binary (Success Response)

    Content-Type: application/json

    Content-Type: image/jpeg


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/png


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/webp


    **Example Response:**

    ```json

    "string"

    ```'
  input_schema:
    required:
    - source
    properties:
      delivery: string
      source: string
      x: integer
      y: integer
      width: integer
      height: integer
      gravity: string
      trim: boolean
      threshold: number
      autorot: boolean
      denoise: integer
      equalize: boolean
      sharpen: boolean
      format: string
  source_operation: openapi/pictomancer-ai-openapi.yml#crop_image
- name: optimize_for_vision
  description: 'Resize an image for a vision model


    Resize an image to the largest size a given vision model still benefits from, and report what it costs
    that model in tokens before and after. Every provider downscales oversized input before counting tokens,
    so this alone saves bytes and upload latency rather than tokens. Pass max_tokens to trade resolution
    for tokens: that lever is continuous on Claude, unavailable on OpenAI (cost follows the aspect ratio
    alone), and on Gemini reaches only a flat 258. An image already within budget is returned untouched
    and free (X-Pig-Billed: 0).


    ### Responses:


    **200**: Processed image binary (Success Response)

    Content-Type: application/json

    Content-Type: image/jpeg


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/png


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/webp


    **Example Response:**

    ```json

    "string"

    ```'
  input_schema:
    required:
    - source
    - target_model
    properties:
      delivery: string
      source: string
      target_model: string
      max_tokens: integer
      format: string
      q: integer
  source_operation: openapi/pictomancer-ai-openapi.yml#optimize_for_vision
- name: optimize_generated_image
  description: 'Optimize an AI-generated image for the web


    The step after image generation. gpt-image, DALL-E, Flux, Midjourney and Stable Diffusion hand back
    2-8 MB PNGs; this returns the same picture as a web-ready webp (default), avif, jpeg or png, metadata
    stripped, transparency kept on webp/avif/png. Optional max_dimension caps the longest side (never
    upscales); optional q or quality_target (smallest file with SSIM >= target, flat surcharge) control
    quality. Same price as convert. If the result is not smaller than the input it is still returned but
    free (X-Pig-Billed: 0). X-Pictomancer-Bytes-Before/-After/-Saved-Percent report the saving. The input''s
    C2PA manifest, if any, is reported in X-Pictomancer-C2PA-Input but is not carried over: re-encoding
    invalidates it.


    ### Responses:


    **200**: Processed image binary (Success Response)

    Content-Type: application/json

    Content-Type: image/jpeg


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/png


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/webp


    **Example Response:**

    ```json

    "string"

    ```'
  input_schema:
    required:
    - source
    properties:
      delivery: string
      source: string
      format: string
      q: integer
      quality_target: number
      max_dimension: integer
      strip: boolean
  source_operation: openapi/pictomancer-ai-openapi.yml#optimize_generated_image
- name: image_pipeline
  description: 'Run a multi-step image pipeline


    Chain multiple operations (resize, compress, convert, crop) in sequence. The image is fetched once,
    then each operation is applied to the output of the previous one. Max 10 operations per pipeline.


    ### Responses:


    **200**: Processed image binary (Success Response)

    Content-Type: application/json

    Content-Type: image/jpeg


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/png


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/webp


    **Example Response:**

    ```json

    "string"

    ```'
  input_schema:
    required:
    - source
    - operations
    properties:
      delivery: string
      source: string
      operations: array
  source_operation: openapi/pictomancer-ai-openapi.yml#image_pipeline
