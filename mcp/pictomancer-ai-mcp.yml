  source_operation: openapi/pictomancer-ai-openapi.yml#get_format_info
- name: estimate_cost
  description: "Estimate the price of an operation\n\nReturns the exact USD price this API would charge\
    \ for an operation on an input of the given size, without fetching or processing anything. Free. Use\
    \ it before paying: send X-Max-Cost-USD on the real request to have the API refuse (412) instead of\
    \ charging more than you allowed. The list price is returned even when the request could end up free\
    \ (free tier, or a compress that does not shrink the file).\n\n### Responses:\n\n**200**: Successful\
    \ Response (Success Response)\nContent-Type: application/json\n\n**Example Response:**\n```json\n\
    {\n  \"operation\": \"Operation\",\n  \"price_usd\": 1.0,\n  \"base_usd\": 1.0,\n  \"surcharges_usd\"\
    : {},\n  \"size_multiplier\": 1.0,\n  \"within_free_tier\": true,\n  \"free_tier_remaining\": 1,\n\
    \  \"currency\": \"Currency\",\n  \"network\": \"Network\"\n}\n```"
  input_schema:
    required:
    - operation
    - input_bytes
    properties:
      operation: string
      input_bytes: integer
      format: string
      quality_target: boolean
      operations: array
  source_operation: openapi/pictomancer-ai-openapi.yml#estimate_cost
- name: analyze_image
  description: "Analyze an image\n\nFetch an image from a URL or base64 and return its metadata: size\
    \ in bytes, pixel dimensions, source format, and what it costs every supported vision model in tokens.\
    \ Always free. Dimensions are omitted if the image header cannot be read. Also reports whether the\
    \ input carries a C2PA (Content Credentials) manifest and in which container; the manifest is not\
    \ validated.\n\n### Responses:\n\n**200**: Successful Response (Success Response)\nContent-Type: application/json\n\
    \n**Example Response:**\n```json\n{\n  \"size_bytes\": 1,\n  \"c2pa_manifest\": true\n}\n```"
  input_schema:
    required:
    - source
    properties:
      source: string
  source_operation: openapi/pictomancer-ai-openapi.yml#analyze_image
- name: resize_image
  description: 'Resize an image


    Scale an image by a factor, or fill an exact box. Use ''scale'' for uniform scaling, or ''scale_x''/''scale_y''
    for independent axes (float factors, e.g. 0.5 = half size). Alternatively set ''width''+''height''
    for fill mode: resize and smart-crop to those exact dimensions in one call (optional ''gravity'',
    default attention). The two modes are mutually exclusive. Optional enhancement modifiers: denoise
    (1-3), equalize, sharpen (applied denoise -> equalize -> op -> sharpen).


    ### Responses:


    **200**: Processed image binary (Success Response)

    Content-Type: application/json

    Content-Type: image/jpeg


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/png


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/webp


    **Example Response:**

    ```json

    "string"

    ```'
  input_schema:
    required:
    - source
    properties:
      delivery: string
      source: string
      scale_x: number
      scale_y: number
      scale: number
      format: string
      width: integer
      height: integer
      gravity: string
      autorot: boolean
      denoise: integer
      equalize: boolean
      sharpen: boolean
  source_operation: openapi/pictomancer-ai-openapi.yml#resize_image
- name: compress_image
  description: 'Compress an image


    Re-encode an image with quality/format options to reduce file size. Supports jpeg, png, webp, tiff,
    gif. Instead of a q number you can set quality_target (0-1]: the smallest file with SSIM at or above
    the target, searched on the worker (jpeg, webp, avif; flat surcharge; outcome reported in X-Pictomancer-Quality-*
    headers). If the output is not smaller than the input, the request is free (X-Pig-Billed: 0) and does
    not consume free-tier quota. Optional enhancement modifiers: denoise (1-3), equalize, sharpen (applied
    denoise -> equalize -> op -> sharpen).


    ### Responses:


    **200**: Processed image binary (Success Response)

    Content-Type: application/json

    Content-Type: image/jpeg


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/png


    **Example Response:**

    ```json

    "string"

    ```

    Content-Type: image/webp


    **Example Response:**

    ```json

    "string"

    ```'
  input_schema:
    required:
    - source
    properties:
      delivery: string
      source: string
      q: integer
      format: string
      strip: boolean
      quality_target: number
      autorot: boolean
      denoise: integer
      equalize: boolean
      sharpen: boolean
  source_operation: openapi/pictomancer-ai-openapi.yml#compress_image
- name: convert_image
  description: 'Convert image format


    Convert an image to a different format (jpeg, png, webp, tiff, gif, avif). Optionally set quality,
    strip metadata, enable lossless mode (webp, avif), or tune encoder effort (avif). Instead of a q number
    you can set quality_target (0-1]: the smallest file with SSIM at or above the target, searched on
    the worker (jpeg, webp, avif; flat surcharge; outcome reported in X-Pictomancer-Quality-* headers).
    Optional enhancement modifiers: denoise (1-3), equalize, sharpen (applied denoise -> equalize -> op
    -> sharpen).


    ### Responses:


    **200**: Processed image binary (Success Response)

    Content-Type: application/json

    Content-Type: image/jpeg


    **Example Response:**

    ```json

