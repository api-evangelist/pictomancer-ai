summary: Pictomancer.ai operates one official remote MCP server at https://api.pictomancer.ai/mcp (Streamable
  HTTP, MCP protocol revision 2025-06-18, tools capability only, no auth required). It is discoverable
  from /.well-known/mcp.json on both pictomancer.ai and api.pictomancer.ai, from the A2A agent card's
  additionalInterfaces, and is listed in the official MCP Registry as ai.pictomancer/image-processing
  (latest 0.4.0, 2026-08-17). mcp.pictomancer.ai is a 308 alias that redirects to api.pictomancer.ai.
  Anonymous tools/list succeeded and returned 10 tools with full inputSchema; the verbatim response is
  saved in mcp/pictomancer-ai-mcp-tools.json.
deployment:
  mode: remote
  endpoint: https://api.pictomancer.ai/mcp
  auth: none
  verified: probed
  note: 'Anonymous initialize returned 200 with a mcp-session-id header and tools/list returned 200 with
    10 tools; the server requires the session id on every call after initialize (a bare tools/list is
    refused with -32600 Missing session ID). No stdio package is published: the SDKs (npm @pictomancer/node,
    PyPI pictomancer, Packagist, Go) are REST clients, not MCP servers. Payment is per-request via x402
    (HTTP 402 -> USDC on Base) or an API key; identity is the X-Agent-Wallet header or the caller IP,
    with 50 free requests per identity.'
server:
  name: Pictomancer.ai
  transport: streamable-http
  url: https://api.pictomancer.ai/mcp
  auth: none
  protocol_version: '2025-06-18'
  capabilities:
    tools:
      listChanged: false
    resources: false
    prompts: false
  discovery:
    well_known_mcp_json:
    - https://pictomancer.ai/.well-known/mcp.json
    - https://api.pictomancer.ai/.well-known/mcp.json
    mcp_registry:
      name: ai.pictomancer/image-processing
      version: 0.4.0
      url: https://registry.modelcontextprotocol.io/v0/servers?search=pictomancer
      updated: '2026-08-17'
      repository: https://gitlab.com/pictomancer.ai/pig-gateway (302 to sign-in; source is private)
    aliases:
    - https://mcp.pictomancer.ai/mcp (308 -> api.pictomancer.ai/mcp)
  rate_limit: 120 requests/minute (X-RateLimit-Limit header; /.well-known/mcp.json rate_limits.requests_per_minute)
  probe:
    method: POST initialize + tools/list
    http_status: 200
    tool_count: 10
    fetched: '2026-09-19'
